name: web

on:
  pull_request:
    paths: ['web/**', 'contracts/**']
  push:
    branches: [main]
    paths: ['web/**', 'contracts/**']

defaults:
  run:
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated API client diff (in sync with contract)
        run: |
          npm run generate:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build
        # The build stamps this origin into the CSP connect-src in
        # dist/_headers; CI only validates the bundle, so any URL will do.
        env:
          VITE_API_URL: http://localhost:8080
        run: npm run build
      - name: Validate the Workers static-assets config
        run: npx wrangler deploy --dry-run
