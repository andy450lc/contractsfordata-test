name: sow

services:
  postgres:
    image: postgres:17-alpine
    container_name: sow-postgres
    environment:
      POSTGRES_USER: sow
      POSTGRES_PASSWORD: sow
      POSTGRES_DB: sow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sow"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
