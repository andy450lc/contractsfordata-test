# Target additions to contracts/openapi.yaml for feature 004. The first
# implementation task merges these into the contract. Paths are relative
# to the /v1 server. Existing /auth/callback, /auth/refresh, /auth/logout,
# /me, and /webhooks/workos are unchanged.
paths:
  /auth/login:
    get:
      operationId: startLogin
      summary: Start a social sign-in
      description: >-
        Builds the identity provider's authorization URL for the named
        social provider with a signed state carrying the validated return
        path, and redirects the browser to it. The browser lands on the
        provider's own consent screen with no intermediate page. A browser
        navigation, not an API call.
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [google]
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
          description: >-
            Same-app absolute path to land on after sign-in. Invalid values
            fall back to /dashboard.
      responses:
        '302':
          description: Redirect to the social provider.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with email and password
      description: >-
        Exchanges the credentials with the identity provider server-side.
        On success seals the session cookie and returns an access token.
        When the email is not yet verified, answers 202 with a pending
        token and the provider emails a six-digit code. A wrong password
        and an unknown email answer the same 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '202':
          $ref: '#/components/responses/VerificationPending'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /auth/sign-up:
    post:
      operationId: signUp
      summary: Create an account with email and password
      description: >-
        Creates the user at the identity provider and starts email
        verification. Answers 202 with a pending token when the input is
        valid, whether or not the address already has an account, so
        nothing reveals which addresses are registered. An address that
        already has an account receives an email saying so instead of a
        code. When the provider does not require verification, answers
        200 with a session instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '202':
          $ref: '#/components/responses/VerificationPending'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '422':
          $ref: '#/components/responses/WeakPassword'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Complete sign-in or sign-up with the emailed code
      description: >-
        Exchanges the pending token and the six-digit code with the
        identity provider. On success seals the session cookie and returns
        an access token. A wrong, expired, or unknown code answers 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '400':
          description: Malformed input (validation_failed) or a rejected code (invalid_code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Email a new verification code
      description: >-
        Asks the identity provider to send a fresh code to the address.
        The previous code stops working. Always answers 202 for a
        well-formed address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Email a password reset link
      description: >-
        Issues a single-use, expiring reset token at the identity provider
        and emails a link to the web app's reset page. Always answers 202
        for a well-formed address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password from a reset link
      description: >-
        Confirms the reset token with the identity provider, sets the new
        password, signs the user in, seals the session cookie, and returns
        an access token. An expired or used token answers 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '400':
          description: Malformed input (validation_failed) or a rejected token (invalid_reset_token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '422':
          $ref: '#/components/responses/WeakPassword'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
components:
  responses:
    SessionStarted:
      description: Signed in. The session cookie is set alongside.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessToken'
    VerificationPending:
      description: The email must be verified before a session starts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PendingVerification'
    ValidationFailed:
      description: Malformed input. details lists field errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: The email and password do not match an account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WeakPassword:
      description: The identity provider rejected the password. details.message says why.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 256
    SignUpRequest:
      type: object
      required: [first_name, last_name, email, password]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 256
    PendingVerification:
      type: object
      required: [pending_token]
      properties:
        pending_token:
          type: string
          maxLength: 512
          description: Opaque, single-use, short-lived. Send back with the code.
    VerifyEmailRequest:
      type: object
      required: [pending_token, code]
      properties:
        pending_token:
          type: string
          maxLength: 512
        code:
          type: string
          pattern: '^[0-9]{6}$'
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          maxLength: 512
        password:
          type: string
          minLength: 8
          maxLength: 256
